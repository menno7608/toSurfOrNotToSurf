name: Android-widget

on:
  push:
    branches: [worktree-telefoon-widget, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Sleutel uit GitHub-geheimen (als die zijn ingesteld)
        env:
          SLEUTEL_B64: ${{ secrets.WIDGET_KEYSTORE_B64 }}
        run: |
          if [ -n "$SLEUTEL_B64" ]; then echo "$SLEUTEL_B64" | base64 -d > android/widget.p12; fi
      - name: APK bouwen
        env:
          WIDGET_KEYSTORE_PASSWORD: ${{ secrets.WIDGET_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: toSurfOrNotToSurf-widget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
