name: Android-widget

on:
  push:
    branches: [worktree-telefoon-widget, main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Sleutel maken (alleen als hij nog niet in de repo staat)
        run: |
          if [ ! -f android/widget.keystore ]; then
            keytool -genkeypair -keystore android/widget.keystore -storetype PKCS12 \
              -alias widget -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass tosurf-widget -keypass tosurf-widget \
              -dname "CN=toSurfOrNotToSurf widget"
            echo "NIEUWE_SLEUTEL=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        if: env.NIEUWE_SLEUTEL == '1'
        with:
          name: widget-keystore
          path: android/widget.keystore
      - name: APK bouwen
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: toSurfOrNotToSurf-widget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
